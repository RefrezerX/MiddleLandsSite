# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#  MythicBarrel's Waterlogged Vol.1-3 — спавн по водным биомам (ваниль + Terralith)
#  Переработано 23.11.2026.
#
#  Два слоя:
#   R_*  (REPLACE) — подменяют часть ванильных рыб/кальмаров/дельфинов,
#                    поэтому общее число мобов в воде от них не растёт.
#   A_*  (ADD, PositionType: SEA) — собственные точки спавна MythicMobs в воде
#                    вокруг игроков. Работают и там, где ваниль почти ничего
#                    не спавнит (Terralith: skylands, alpha/mirage isles,
#                    gravel_beach, болота, оазисы, пруды в джунглях).
#  Плотность: у каждой группы свой лимит mobsinradius + общий лимит
#  не больше 24 мобов этих паков в радиусе 48 блоков.
#  Cooldown — секунды между спавнами одного правила.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# ===================== СЛОЙ 1: ЗАМЕНА ВАНИЛЬНЫХ =====================

